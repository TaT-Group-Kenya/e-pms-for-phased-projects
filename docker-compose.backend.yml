services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: epms-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: epms_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - epms-backend-network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.backend
    container_name: epms-backend
    restart: always
    ports:
      - "8000:8000"
      - "8443:8443"
    depends_on:
      - db
    env_file:
      - ./backend-for-frontend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # Clear APP_URL so it reads from .env file
      APP_URL: ""
      # Clear APP_URL_HOST so nginx config extracts from APP_URL
      APP_URL_HOST: ""
    volumes:
      - ./backend-for-frontend:/var/www/html
      - ./docker/backend/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - epms-backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost:8443/e-pms/api/v1/companies"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  epms-backend-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local
  backend_bootstrap_cache:
    driver: local
