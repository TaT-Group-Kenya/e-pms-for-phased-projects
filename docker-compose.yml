services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: epms-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: epms_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - epms-network

  # Laravel Backend - No external exposure
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: epms-backend
    restart: always
    expose:
      - "9000"
    depends_on:
      - db
    env_file:
      - ./backend-for-frontend/.env
    environment:
      DB_HOST: db
    volumes:
      - ./backend-for-frontend:/var/www/html
      - ./docker/backend/php.ini:/usr/local/etc/php/php.ini
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - epms-network

  # Next.js Frontend - With reverse proxy on port 443
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_EPMS_API_BASE=${NEXT_PUBLIC_EPMS_API_BASE}
    env_file:
      - ./front-for-web/.env.local
    container_name: epms-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/frontend/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot
    networks:
      - epms-network

networks:
  epms-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local
  backend_bootstrap_cache:
    driver: local
  certbot_data:
    driver: local